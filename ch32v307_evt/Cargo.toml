[package]
name = "ch32v307_evt"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = [ "Arthur Heymans <arthur@aheymans.xyz>" ]

[dependencies]
ch32-hal = { workspace = true, features = [
    "ch32v307vct6",
    "memory-x",
    "embassy",
    "rt",
    "highcode",
    "time-driver-tim1",
] }
qingke = "*"
qingke-rt = "*"
assign-resources.workspace = true
critical-section.workspace = true
defmt-rtt.workspace = true
defmt.workspace = true
embassy-executor = { workspace = true, features = ["arch-spin", "defmt", "executor-thread", "nightly"] }
embassy-futures = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { workspace = true, features = ["defmt"] }
futures.workspace = true
heapless = { workspace = true, features = ["portable-atomic", "portable-atomic-critical-section", "ufmt"] }
#panic-probe.workspace = true
panic-halt = "1.0"
portable-atomic.workspace = true
serprog.workspace = true
static_cell.workspace = true
ufmt.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
